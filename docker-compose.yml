services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: daikinprocer
    restart: unless-stopped
    ports:
      - "${PORT:-3333}:3333"
    environment:
      - NODE_ENV=production
      - PORT=3333
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://www.prosergrup.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-proser2026}
      - ADMIN_SECRET=${ADMIN_SECRET:-daikinprocer-secure-secret-key-2026}
    env_file:
      - path: .env
        required: false
    volumes:
      - daikin_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3333/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  daikin_data:
    name: daikin_data
