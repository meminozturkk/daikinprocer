name: Deploy to Production (Self-Hosted Runner)

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Avoid concurrent overlapping deployments
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Preserve existing server data before checkout
        run: |
          if [ -d "data" ]; then
            echo "Backing up existing data directory before git checkout..."
            mkdir -p /tmp/daikin_data_backup
            cp -r data/* /tmp/daikin_data_backup/ 2>/dev/null || true
            # Revert local changes on tracked files so actions/checkout doesn't conflict
            git checkout -- data/site-content.json 2>/dev/null || true
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment File from GitHub Secrets
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: |
          cat << EOF > .env
          NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://www.prosergrup.com}
          ADMIN_PASSWORD=${ADMIN_PASSWORD:-proser2026}
          ADMIN_SECRET=${ADMIN_SECRET:-daikinprocer-secure-secret-key-2026}
          EOF

      - name: Initialize and protect persistent Docker volume
        run: |
          echo "Ensuring persistent Docker volume (daikin_data) exists..."
          docker volume create daikin_data

          # Check if volume already contains site-content.json
          HAS_DATA=$(docker run --rm -v daikin_data:/vol node:20-alpine sh -c "[ -f /vol/site-content.json ] && echo 'yes' || echo 'no'")
          echo "Does persistent volume already have site-content.json? => $HAS_DATA"

          if [ "$HAS_DATA" = "no" ]; then
            echo "Initializing persistent volume for the first time..."
            if [ -f "/tmp/daikin_data_backup/site-content.json" ]; then
              echo "Restoring from previous server data backup..."
              docker run --rm -v daikin_data:/vol -v /tmp/daikin_data_backup:/src node:20-alpine sh -c "cp -r /src/* /vol/ && chown -R 1001:1001 /vol"
            elif [ -d "data" ]; then
              echo "Seeding with initial repository data..."
              docker run --rm -v daikin_data:/vol -v "$(pwd)/data":/src node:20-alpine sh -c "cp -r /src/* /vol/ && chown -R 1001:1001 /vol"
            fi
          else
            echo "Persistent volume already contains production data. Keeping live content intact!"
          fi

          # Ensure directories and permissions for nextjs user (1001:1001)
          docker run --rm -v daikin_data:/vol node:20-alpine sh -c "mkdir -p /vol/uploads/catalog && chown -R 1001:1001 /vol"

          # Clean temporary backup
          rm -rf /tmp/daikin_data_backup

      - name: Build and Start Containers
        run: |
          docker compose build --pull
          docker compose up -d --remove-orphans

      - name: Health Check
        run: |
          echo "Checking container health..."
          docker compose ps
          # Wait up to 30 seconds for Next.js to start
          for i in {1..10}; do
            if docker compose exec -T app wget -qO- http://127.0.0.1:3333/ > /dev/null 2>&1 || curl -sSf http://127.0.0.1:3333/ > /dev/null 2>&1; then
              echo "App is healthy and responding on port 3333!"
              exit 0
            fi
            echo "Waiting for app to start (attempt $i/10)..."
            sleep 3
          done
          echo "Warning: Health check did not respond within timeout, check docker logs."

      - name: Clean up unused Docker images
        if: always()
        run: |
          docker image prune -f
